# This workflow runs label-gated CI jobs (macOS and Windows builds).
# It lives in a separate workflow from CI_primary.yml so that adding a
# label does not cancel the in-progress Linux build and lint run.
#
# Instead of using cancel-in-progress, a Gate job decides whether to
# proceed or bail out:
#   - On code changes (synchronize, opened, reopened, push): cancel any
#     older in-progress runs for the same branch, then proceed.
#   - On label additions: check whether macOS/Windows builds already ran
#     (or are running) for the same HEAD SHA.  If so, wait for that run to
#     finish and have the build jobs report its results instead of building
#     again, so the required checks reflect the real outcome.

name: FreeCAD CI approved

on:
  workflow_dispatch: ~
  push:
    branches:
      - main
      - releases/**
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group: ~

permissions:
  contents: read

jobs:
  Gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      previous-run-id: ${{ steps.check.outputs.previous-run-id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Decide whether this run is needed
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const action = context.payload.action;

            // For labeled events, check whether builds already exist for this SHA. If they do, wait for that run
            // to finish and have this run mirror its results rather than building again.
            if (isPR && action === 'labeled') {
              const headSha = context.payload.pull_request.head.sha;
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'CI_approved.yml',
                event: 'pull_request',
                head_sha: headSha,
                per_page: 100,
              });

              // Mirror jobs reuse the build job names; their mirror step tells them apart.
              // Mirroring only real builds keeps a stale failure from propagating through mirrors.
              const mirrorStepName = 'Report result of previous run';
              const skipPrefixes = ['Gate', 'Prepare', 'WrapUp'];
              const isRealBuild = job =>
                !skipPrefixes.some(p => job.name.startsWith(p))
                && job.conclusion !== 'skipped'
                && !(job.steps ?? []).some(
                  s => s.name === mirrorStepName && s.conclusion !== 'skipped');

              // Only older runs count, so concurrent label events cannot wait on each other.
              const olderRuns = runs.filter(r => r.id < context.runId).sort((a, b) => b.id - a.id);

              for (let run of olderRuns) {
                // Wait even before build jobs exist, or simultaneous label events all build.
                while (run.status !== 'completed') {
                  core.info(`Waiting for run ${run.html_url} (status: ${run.status}) to complete`);
                  await new Promise(resolve => setTimeout(resolve, 60000));
                  ({ data: run } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  }));
                }

                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const buildJobs = jobs.filter(isRealBuild);
                if (buildJobs.length === 0) {
                  continue;
                }

                if (buildJobs.some(j => j.conclusion === 'cancelled')) {
                  core.info(`Run ${run.id} was cancelled, building again`);
                  break;
                }

                core.info(`Skipping build: mirroring results of run ${run.id} for SHA ${headSha}`);
                core.setOutput('should-run', 'false');
                core.setOutput('previous-run-id', String(run.id));
                return;
              }

              core.setOutput('should-run', 'true');
              return;
            }

            // For non-PR events (basically just push to main/releases and workflow_dispatch), each commit
            // gets its own run to help pinpoint any failures to a specific commit.
            if (!isPR) {
              core.setOutput('should-run', 'true');
              return;
            }

            // For PR code changes (synchronize/opened/reopened), cancel older runs on the same head ref so we don't
            // waste CI resources on stale code.
            const branch = context.payload.pull_request.head.ref;
            for (const status of ['in_progress', 'queued']) {
              const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'CI_approved.yml',
                branch: branch,
                status: status,
              });
              // Newer runs hold newer code, or label runs for this SHA whose required checks
              // must not be lost to a cancellation.
              for (const run of runs.filter(r => r.id < context.runId)) {
                core.info(`Canceling stale run ${run.id} (status: ${status})`);
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (e) {
                  core.warning(`Failed to cancel run ${run.id}: ${e.message}`);
                }
              }
            }

            core.setOutput('should-run', 'true');

  Prepare:
    needs: [Gate]
    uses: ./.github/workflows/sub_prepare.yml
    with:
      artifactBasename: Prepare-approved-${{ github.run_id }}
      skipBuild: ${{ needs.Gate.outputs.should-run != 'true' }}

  Pixi:
    needs: [Gate, Prepare]
    if: >-
      needs.Prepare.result == 'success'
      && (needs.Gate.outputs.should-run == 'true' || needs.Gate.outputs.previous-run-id != '')
      && (github.event_name != 'pull_request'
          || startsWith(github.event.pull_request.base.ref, 'releases/')
          || contains(toJSON(github.event.pull_request.labels.*.name), 'Approved:'))
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/sub_buildPixi.yml
    with:
      artifactBasename: Pixi-${{ github.run_id }}
      skipBuild: ${{ needs.Gate.outputs.should-run != 'true' }}
      mirrorRunId: ${{ needs.Gate.outputs.previous-run-id }}

  Windows:
    needs: [Gate, Prepare]
    if: >-
      needs.Prepare.result == 'success'
      && (needs.Gate.outputs.should-run == 'true' || needs.Gate.outputs.previous-run-id != '')
      && !startsWith(github.head_ref, 'refs/heads/backport-')
      && (github.event_name != 'pull_request'
          || startsWith(github.event.pull_request.base.ref, 'releases/')
          || contains(toJSON(github.event.pull_request.labels.*.name), 'Approved:'))
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/sub_buildWindows.yml
    with:
      artifactBasename: Windows-${{ github.run_id }}
      skipBuild: ${{ needs.Gate.outputs.should-run != 'true' }}
      mirrorRunId: ${{ needs.Gate.outputs.previous-run-id }}

  WrapUp:
    needs: [
        Gate,
        Prepare,
        Pixi,
        Windows
      ]
    if: always()
    uses: ./.github/workflows/sub_wrapup.yml
    with:
      previousSteps: ${{ toJSON(needs) }}
