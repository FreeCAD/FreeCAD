# This workflow runs label-gated CI jobs (macOS and Windows builds).
# It lives in a separate workflow from CI_primary.yml so that adding a
# label does not cancel the in-progress Linux build and lint run.
#
# Instead of using cancel-in-progress, a Gate job handles cancellation:
#   - On PR code changes (synchronize, opened, reopened): cancel any
#     older in-progress runs for the same branch, then proceed.
#   - On label additions: reuse existing build results for the same PR
#     and HEAD SHA, waiting for unfinished runs without canceling them.
#     Report those results under the required matrix check names.

name: FreeCAD CI approved

on:
  workflow_dispatch: ~
  push:
    branches:
      - main
      - releases/**
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group: ~

permissions:
  contents: read

jobs:
  Gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      build-results: ${{ steps.check.outputs.build-results }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Decide whether this run is needed
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const action = context.payload.action;

            if (isPR && action === 'labeled') {
              const pr = context.payload.pull_request;
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'CI_approved.yml',
                event: 'pull_request',
                branch: pr.head.ref,
                head_sha: pr.head.sha,
                per_page: 100,
              });
              // Fork runs can have no PR association in the Actions API.
              const otherRuns = runs.filter(r =>
                r.id < context.runId
                && r.head_repository.id === pr.head.repo.id
                && (r.pull_requests.length === 0 || r.pull_requests.some(p => p.number === pr.number))
              ).sort((a, b) => b.id - a.id);

              for (let run of otherRuns) {
                // A previous Gate/Prepare may not have created build jobs yet.
                // Only wait for older runs so concurrent label events cannot deadlock.
                while (run.status !== 'completed') {
                  core.info(`Waiting for run ${run.id} for SHA ${pr.head.sha}`);
                  await new Promise(resolve => setTimeout(resolve, 30000));
                  ({ data: run } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  }));
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  filter: 'all',
                  per_page: 100,
                });
                const buildJobs = jobs.filter(j =>
                  j.name.startsWith('Pixi / ') || j.name.startsWith('Windows / ')
                );
                if (buildJobs.length > 0) {
                  core.info(`Reusing build results from ${run.html_url}`);
                  // Keep the newest attempt for each job when a run was retried.
                  core.setOutput('build-results', JSON.stringify(Object.fromEntries(
                    buildJobs.sort((a, b) => a.id - b.id).map(j => [j.name, j.conclusion])
                  )));
                  core.setOutput('should-run', 'false');
                  return;
                }
              }

              core.setOutput('should-run', 'true');
              return;
            }

            // For non-PR events (basically just push to main/releases and workflow_dispatch), each commit
            // gets its own run to help pinpoint any failures to a specific commit.
            if (!isPR) {
              core.setOutput('should-run', 'true');
              return;
            }

            // For PR code changes (synchronize/opened/reopened), cancel older runs on the same head ref so we don't
            // waste CI resources on stale code.
            const branch = context.payload.pull_request.head.ref;
            for (const status of ['in_progress', 'queued']) {
              const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'CI_approved.yml',
                branch: branch,
                status: status,
              });
              for (const run of runs.filter(r => r.id < context.runId)) {
                core.info(`Canceling stale run ${run.id} (status: ${status})`);
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                } catch (e) {
                  core.warning(`Failed to cancel run ${run.id}: ${e.message}`);
                }
              }
            }

            core.setOutput('should-run', 'true');

  Prepare:
    needs: [Gate]
    uses: ./.github/workflows/sub_prepare.yml
    with:
      artifactBasename: Prepare-approved-${{ github.run_id }}
      skipBuild: ${{ needs.Gate.outputs.should-run != 'true' }}

  Pixi:
    needs: [Gate, Prepare]
    if: >-
      needs.Prepare.result == 'success'
      && (needs.Gate.outputs.should-run == 'true' || needs.Gate.outputs.build-results != '')
      && (github.event_name != 'pull_request'
          || startsWith(github.event.pull_request.base.ref, 'releases/')
          || contains(toJSON(github.event.pull_request.labels.*.name), 'Approved:'))
    uses: ./.github/workflows/sub_buildPixi.yml
    with:
      artifactBasename: Pixi-${{ github.run_id }}
      skipBuild: ${{ needs.Gate.outputs.should-run != 'true' }}
      buildResults: ${{ needs.Gate.outputs.build-results }}

  Windows:
    needs: [Gate, Prepare]
    if: >-
      needs.Prepare.result == 'success'
      && (needs.Gate.outputs.should-run == 'true' || needs.Gate.outputs.build-results != '')
      && !startsWith(github.head_ref, 'refs/heads/backport-')
      && (github.event_name != 'pull_request'
          || startsWith(github.event.pull_request.base.ref, 'releases/')
          || contains(toJSON(github.event.pull_request.labels.*.name), 'Approved:'))
    uses: ./.github/workflows/sub_buildWindows.yml
    with:
      artifactBasename: Windows-${{ github.run_id }}
      skipBuild: ${{ needs.Gate.outputs.should-run != 'true' }}
      buildResults: ${{ needs.Gate.outputs.build-results }}

  WrapUp:
    needs: [
        Gate,
        Prepare,
        Pixi,
        Windows
      ]
    if: always()
    uses: ./.github/workflows/sub_wrapup.yml
    with:
      previousSteps: ${{ toJSON(needs) }}
