# Publish freecad-typings to PyPI via trusted publishing (OIDC).
# Manual dispatch only. Fails if version.json carries a non-empty suffix
# (dev, RC, etc.) — only stable releases are published.

name: Publish freecad-typings

on:
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify stable version
        run: |
          suffix=$(python3 -c "import json; print(json.load(open('version.json'))['version_suffix'])")
          if [ -n "$suffix" ]; then
            echo "::error::version_suffix is '${suffix}' — only stable releases (empty suffix) may be published."
            exit 1
          fi
          version=$(python3 -c "import json; d=json.load(open('version.json')); s='.'+d['version_suffix'] if d['version_suffix'] else ''; print(f\"{d['version_major']}.{d['version_minor']}.{d['version_patch']}{s}\")")
          echo "Publishing version: ${version}"

      - name: Generate stubs
        run: |
          python3 src/Tools/typing/generate_stubs.py \
            --root . \
            --out-dir src/Tools/typing/generated

      - name: Build package
        run: uv build
        working-directory: src/Tools/typing/generated

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: src/Tools/typing/generated/dist
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist
