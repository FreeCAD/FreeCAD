# Publish freecad-typings to PyPI via trusted publishing (OIDC). Manual dispatch only.
#
# The target index is chosen by the dispatched ref: a release branch publishes to PyPI, every
# other branch publishes to TestPyPI as a .devN build. The environment deployment branch
# policies enforce the same rule independently, so this routing is for clarity and a fast
# failure, not for security.
#
# The version is major.minor from src/Tools/typing/api_version.json, which versions the FreeCAD
# Python API rather than the FreeCAD release, plus a patch number counted from the releases
# already on PyPI. Counting published releases rather than CI runs is what keeps the patch
# sequence gapless: a dispatch abandoned at the approval gate consumes nothing.

name: Publish freecad-typings

on:
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: publish-freecad-typings
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      index_name: ${{ steps.target.outputs.index_name }}
      environment: ${{ steps.target.outputs.environment }}
      repository_url: ${{ steps.target.outputs.repository_url }}
      skip_existing: ${{ steps.target.outputs.skip_existing }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Determine target index
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          if os.environ["REF_NAME"].startswith("releases/"):
              with open("version.json", encoding="utf-8") as f:
                  suffix = json.load(f)["version_suffix"].strip().lstrip(".")
              if suffix.lower() == "dev":
                  sys.exit(
                      "Refusing to publish to PyPI: this release branch still carries the 'dev' "
                      "version suffix. Run sync_version.py on the branch first."
                  )
              print("index_name=PyPI")
              print("environment=pypi")
              print("repository_url=https://upload.pypi.org/legacy/")
              print("skip_existing=false")
              print("dev_build=")
          else:
              print("index_name=TestPyPI")
              print("environment=testpypi")
              print("repository_url=https://test.pypi.org/legacy/")
              print("skip_existing=true")
              print(f"dev_build={os.environ['RUN_NUMBER']}")
          PY

      - name: Assign patch number
        id: version
        run: |
          echo "patch=$(python3 src/Tools/typing/generate_stubs.py next-patch --root .)" \
            >> "$GITHUB_OUTPUT"

      - name: Generate and validate stubs
        env:
          PATCH: ${{ steps.version.outputs.patch }}
          DEV_BUILD: ${{ steps.target.outputs.dev_build }}
        run: |
          args=(check --root . --out-dir src/Tools/typing/generated --no-pyright
                --patch-number "$PATCH")
          if [ -n "$DEV_BUILD" ]; then
            args+=(--dev-build "$DEV_BUILD")
          fi
          python3 src/Tools/typing/generate_stubs.py "${args[@]}"

      - name: Build package
        working-directory: src/Tools/typing/generated
        run: |
          uv build
          echo "Built: $(ls dist | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: src/Tools/typing/generated/dist
          retention-days: 7

  publish:
    name: Publish to ${{ needs.build.outputs.index_name }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to ${{ needs.build.outputs.index_name }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: ${{ needs.build.outputs.repository_url }}
          skip-existing: ${{ needs.build.outputs.skip_existing }}
