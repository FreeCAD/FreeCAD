name: Build Qt-independent core

on:
  workflow_call:
    inputs:
      artifactBasename:
        type: string
        required: true
      skipBuild:
        default: false
        type: boolean
        required: false
    outputs:
      reportFile:
        value: ${{ jobs.Build.outputs.reportFile }}

permissions:
  contents: read

jobs:
  Build:
    name: Qt-independent core
    runs-on: ubuntu-24.04
    env:
      builddir: ${{ github.workspace }}/build/core-no-qt/
      logdir: /tmp/core-no-qt-logs/
      reportdir: /tmp/core-no-qt-report/
      reportfilename: ${{ inputs.artifactBasename }}-report.md
    defaults:
      run:
        shell: bash
    outputs:
      reportFile: ${{ steps.Init.outputs.reportFile }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: "!inputs.skipBuild"
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checking out source code
        if: "!inputs.skipBuild"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Install FreeCAD dependencies
        if: "!inputs.skipBuild"
        run: ./package/ubuntu/install-apt-packages.sh

      - name: Make needed directories and initialize report
        if: "!inputs.skipBuild"
        id: Init
        run: |
          mkdir -p "${{ env.logdir }}" "${{ env.reportdir }}"
          echo "reportFile=${{ env.reportfilename }}" >> "$GITHUB_OUTPUT"
          echo "# Qt-independent core" > "${{ env.reportdir }}${{ env.reportfilename }}"

      - name: Install cmake
        if: "!inputs.skipBuild"
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '3.31.6'

      - name: CMake Configure
        if: "!inputs.skipBuild"
        uses: ./.github/workflows/actions/linux/configure
        with:
          extraParameters: -G Ninja --preset core-no-qt
          builddir: ${{ env.builddir }}
          logFile: ${{ env.logdir }}configure.log
          errorFile: ${{ env.logdir }}configure-errors.log
          reportFile: ${{ env.reportdir }}${{ env.reportfilename }}

      - name: Verify Qt-independent configuration
        if: "!inputs.skipBuild"
        run: |
          grep -qxF 'BUILD_GUI:BOOL=OFF' "${{ env.builddir }}CMakeCache.txt"
          grep -qxF 'FREECAD_QT_VERSION:STRING=None' "${{ env.builddir }}CMakeCache.txt"

      - name: CMake Build
        if: "!inputs.skipBuild"
        uses: ./.github/workflows/actions/linux/build
        with:
          extraParameters: --target FreeCADBase FreeCADApp Base_tests_run App_tests_run
          builddir: ${{ env.builddir }}
          logFile: ${{ env.logdir }}build.log
          errorFile: ${{ env.logdir }}build-errors.log
          reportFile: ${{ env.reportdir }}${{ env.reportfilename }}

      - name: C++ Base tests
        if: "!inputs.skipBuild"
        id: base
        timeout-minutes: 1
        uses: ./.github/workflows/actions/runCPPTests/runSingleTest
        with:
          testCommand: ${{ env.builddir }}/tests/Base_tests_run --gtest_output=json:${{ env.reportdir }}base_gtest_results.json
          testLogFile: ${{ env.reportdir }}base_gtest_test_log.txt
          testName: Base (Qt-independent)

      - name: C++ App tests
        if: "!inputs.skipBuild"
        id: app
        timeout-minutes: 1
        uses: ./.github/workflows/actions/runCPPTests/runSingleTest
        with:
          testCommand: ${{ env.builddir }}/tests/App_tests_run --gtest_output=json:${{ env.reportdir }}app_gtest_results.json
          testLogFile: ${{ env.reportdir }}app_gtest_test_log.txt
          testName: App (Qt-independent)

      - name: Compose C++ test report
        if: always() && !inputs.skipBuild
        shell: bash -l {0}
        run: |
          if [ "${{ job.status }}" != "success" ]
          then
            echo ":fire: Qt-independent C++ tests failed" >> "${{ env.reportdir }}${{ env.reportfilename }}"
          else
            echo ":heavy_check_mark: Qt-independent C++ tests succeeded" >> "${{ env.reportdir }}${{ env.reportfilename }}"
          fi
          echo "" >> "${{ env.reportdir }}${{ env.reportfilename }}"
          echo "<blockquote>" >> "${{ env.reportdir }}${{ env.reportfilename }}"
          cat > /tmp/core-no-qt-test-steps << "EOD"
          ${{ toJSON(steps) }}
          EOD
          jq -r ".[] | .outputs.reportText // empty" /tmp/core-no-qt-test-steps >> "${{ env.reportdir }}${{ env.reportfilename }}"
          echo "</blockquote>" >> "${{ env.reportdir }}${{ env.reportfilename }}"

      - name: Upload logs
        if: always() && !inputs.skipBuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifactBasename }}-Logs
          path: ${{ env.logdir }}

      - name: Upload report
        if: always() && !inputs.skipBuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.reportfilename }}
          path: ${{ env.reportdir }}${{ env.reportfilename }}
