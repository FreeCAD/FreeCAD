name: Fetch Crowdin Translations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

env:
  TRANSLATION_REF: "releases/FreeCAD-26-3"

# Writes happen via the GH_TOKEN_FOR_CROWDIN_SYNC secret; GITHUB_TOKEN stays read-only.
permissions:
  contents: read

jobs:
  update-crowdin:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'FreeCAD' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSLATION_REF }}
          token: ${{ secrets.GH_TOKEN_FOR_CROWDIN_SYNC }}

      - name: Compute PR branch name
        run: |
          echo "PR_BRANCH=update-crowdin-translations-${TRANSLATION_REF//\//-}" >> "$GITHUB_ENV"

      - name: Install Qt ≥ 6.8
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          aqtversion: "==3.1.*"
          version: "6.8.3"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"

      - name: Setup Python & dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install pyside6

      - name: Gather translations from crowdin
        run: |
          ./updatecrowdin.py build
          while ./updatecrowdin.py build-status | grep -q "status: inProgress"; do sleep 10; done
          ./updatecrowdin.py download
          ./updatecrowdin.py install
        working-directory: ./src/Tools
        env:
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
          CROWDIN_PROJECT_ID: freecad

      - name: Commit changes
        run: |
          git config --global user.name "freecad-gh-actions-translation-bot"
          git config --global user.email "freecad-gh-actions-translation-bot@github.com"
          git add src
          git commit -m "Update translations from Crowdin" || echo "No changes to commit"

      - name: Push changes to a new branch
        run: |
          git branch "$PR_BRANCH"
          git push origin "$PR_BRANCH" --force

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: ${{ env.PR_BRANCH }}
          base: ${{ env.TRANSLATION_REF }}
          title: "Update translations from Crowdin"
          body: "Automatic Crowdin update."
          labels: "Approved: CI"
          token: ${{ secrets.GH_TOKEN_FOR_CROWDIN_SYNC }}
          delete-branch: true
          add-paths: |
            src
