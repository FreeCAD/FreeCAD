# Triage pull requests, inherit issue labels, and label modified paths.
#
# For more information, see:
# https://github.com/actions/labeler

name: Labeler
on:
  pull_request_target:
    types: [opened, reopened, edited]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  label:
    if: >-
      github.event.pull_request.state == 'open'
      && (github.event.action != 'edited' || github.event.changes.body)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: 'Add "Status: Needs triage" label'
      if: github.event.action != 'edited'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { data: pr } = await github.rest.issues.get({
            ...context.repo,
            issue_number: context.payload.pull_request.number
          });
          const typeLabels = new Set(['Type: Bug', 'Type: Feature', 'Type: Other']);
          const existing = pr.labels
            .map(label => label.name)
            .filter(name => typeLabels.has(name));

          if (existing.length > 0) {
            core.info(`Pull request is already typed (${existing.join(', ')}); skipping triage label.`);
            return;
          }

          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: ['Status: Needs triage']
          });

    - name: 'Apply labels from referenced issues'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const { data: pr } = await github.rest.issues.get({
            owner,
            repo,
            issue_number: context.payload.pull_request.number
          });
          const typeLabels = ['Type: Bug', 'Type: Feature', 'Type: Other'];
          const regressionLabel = 'Type: Regression';
          const issueNumbers = new Set();

          const escapedOwner = owner.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const escapedRepo = repo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const issueUrlPattern = new RegExp(`https://github\\.com/${escapedOwner}/${escapedRepo}/issues/(\\d+)`, 'gi');
          const qualifiedIssueRefPattern = new RegExp(`(?:^|[^\\w.-])${escapedOwner}/${escapedRepo}#(\\d+)\\b`, 'gi');
          const issueRefPattern = /(?:^|[^\w.-])#(\d+)\b/g;

          const body = (pr.body || '')
            .replace(/<!--[\s\S]*?-->/g, '')
            .replace(/```[\s\S]*?```/g, '');

          for (const match of body.matchAll(issueUrlPattern)) {
            issueNumbers.add(Number(match[1]));
          }

          for (const match of body.matchAll(qualifiedIssueRefPattern)) {
            issueNumbers.add(Number(match[1]));
          }

          for (const match of body.matchAll(issueRefPattern)) {
            issueNumbers.add(Number(match[1]));
          }

          if (issueNumbers.size === 0) {
            core.info('No same-repository issue references found in the pull request body.');
            return;
          }

          const linkedIssueTypes = new Set();
          let hasRegression = false;

          for (const issue_number of issueNumbers) {
            try {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number
              });

              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request, not an issue; skipping.`);
                continue;
              }

              linkedIssueTypes.add(issue.type?.name || 'Other');
              hasRegression ||= issue.labels.some(label => label.name === regressionLabel);
            } catch (error) {
              core.warning(`Could not read issue #${issue_number}: ${error.message}`);
            }
          }

          if (linkedIssueTypes.size === 0) {
            core.info('No valid same-repository issues found.');
            return;
          }

          const targetLabel = linkedIssueTypes.has('Bug')
            ? 'Type: Bug'
            : linkedIssueTypes.has('Feature')
              ? 'Type: Feature'
              : 'Type: Other';

          const currentLabels = new Set(pr.labels.map(label => label.name));
          for (const label of typeLabels) {
            if (label !== targetLabel && currentLabels.has(label)) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
          }

          const labelsToAdd = [targetLabel];
          if (hasRegression) {
            labelsToAdd.push(regressionLabel);
          }

          const missingLabels = labelsToAdd.filter(label => !currentLabels.has(label));
          if (missingLabels.length > 0) {
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: missingLabels
            });
          }

          core.info(`Applied ${labelsToAdd.join(', ')} based on referenced issues.`);

    - name: 'Assign "tbd" milestone'
      if: github.event.action != 'edited'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const pr = context.payload.pull_request;
          const milestoneTitle = 'tbd';

          if (pr.milestone) {
            core.info(`Pull request already has milestone "${pr.milestone.title}", leaving it untouched.`);
            return;
          }

          const milestones = await github.paginate(github.rest.issues.listMilestones, {
            owner,
            repo,
            state: 'open',
            per_page: 100
          });

          const milestone = milestones.find(
            item => item.title.toLowerCase() === milestoneTitle.toLowerCase()
          );

          if (!milestone) {
            core.warning(`No open milestone named "${milestoneTitle}" found; skipping.`);
            return;
          }

          const { data: currentPr } = await github.rest.issues.get({
            owner,
            repo,
            issue_number: pr.number
          });

          if (currentPr.milestone) {
            core.info(`Pull request already has milestone "${currentPr.milestone.title}", leaving it untouched.`);
            return;
          }

          await github.rest.issues.update({
            owner,
            repo,
            issue_number: pr.number,
            milestone: milestone.number
          });

          core.info(`Assigned milestone "${milestone.title}" (#${milestone.number}).`);

    - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
      if: github.event.action != 'edited'
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: ".github/labels.yml"
        sync-labels: false
