<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg1"
   sodipodi:docname="foo2.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <sodipodi:namedview
     id="namedview1"
     inkscape:document-units="px"
     inkscape:zoom="11.313708"
     inkscape:cx="28.107496"
     inkscape:cy="32.350137"
     showgrid="true"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:current-layer="svg1">
    <!-- 2.6667 units = 1 pixel at 24px; edges on these lines render crisp -->
    <inkscape:grid
       id="grid24px"
       type="xygrid"
       units="px"
       originx="0"
       originy="0"
       spacingx="2.6666667"
       spacingy="2.6666667"
       empspacing="3"
       visible="false"
       enabled="false" />
    <inkscape:grid
       id="grid1"
       units="px"
       originx="0"
       originy="0"
       spacingx="1"
       spacingy="1"
       empcolor="#0099e5"
       empopacity="0.30196078"
       color="#0099e5"
       opacity="0.14901961"
       empspacing="5"
       enabled="true"
       visible="true" />
  </sodipodi:namedview>
  <title
     id="title1">vertex-selection</title>
  <defs
     id="defs1">
    <!-- front face: dark teal at bottom to light teal at top -->
    <linearGradient
       id="gradFront"
       gradientUnits="userSpaceOnUse"
       x1="22"
       y1="58"
       x2="28"
       y2="19"
       gradientTransform="translate(4)">
      <stop
         offset="0"
         style="stop-color:#06989a"
         id="stopFront0" />
      <stop
         offset="1"
         style="stop-color:#34e0e2"
         id="stopFront1" />
    </linearGradient>
    <!-- right face: one step darker than the front, for depth -->
    <linearGradient
       id="gradRight"
       gradientUnits="userSpaceOnUse"
       x1="51"
       y1="51"
       x2="51"
       y2="12"
       gradientTransform="translate(4)">
      <stop
         offset="0"
         style="stop-color:#046a6b"
         id="stopRight0" />
      <stop
         offset="1"
         style="stop-color:#06989a"
         id="stopRight1" />
    </linearGradient>
    <!-- vertex dot: dark red lower right to bright red upper left -->
    <linearGradient
       id="gradVertex"
       gradientUnits="userSpaceOnUse"
       x1="49"
       y1="24"
       x2="39"
       y2="14">
      <stop
         offset="0"
         style="stop-color:#a40000"
         id="stopVertex0" />
      <stop
         offset="1"
         style="stop-color:#ef2929"
         id="stopVertex1" />
    </linearGradient>
    <!-- pointer: white to light grey -->
    <linearGradient
       id="gradPointer"
       gradientUnits="userSpaceOnUse"
       x1="28"
       y1="55"
       x2="18"
       y2="30">
      <stop
         offset="0"
         style="stop-color:#d3d7cf"
         id="stopPointer0" />
      <stop
         offset="1"
         style="stop-color:#ffffff"
         id="stopPointer1" />
    </linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     inkscape:label="Cube"
     id="layer-cube">
    <path
       id="cube-top"
       style="fill:#8ae8e9;stroke:#042a2a;stroke-width:2;stroke-linejoin:round"
       d="M 10,19 24,6 H 62 L 48,19 Z" />
    <path
       id="cube-right"
       style="fill:url(#gradRight);stroke:#042a2a;stroke-width:2;stroke-linejoin:round"
       d="M 48,19 62,6 V 44 L 48,58 Z" />
    <path
       id="cube-front"
       style="fill:url(#gradFront);stroke:#042a2a;stroke-width:2;stroke-linejoin:round"
       d="M 10,19 H 48 V 58 H 10 Z" />
  </g>
  <g
     inkscape:groupmode="layer"
     inkscape:label="Cube highlights"
     id="layer-cube-highlights"
     style="display:inline">
    <!-- inset bevel rims, 2 units inside each shaded face -->
    <path
       id="front-rim"
       style="fill:none;stroke:#8ae8e9;stroke-linejoin:miter;stroke-width:2.0"
       d="M 12 21 L 46 21 L 46 56 L 12 56 Z" />
    <path
       id="right-rim"
       style="fill:none;stroke:#16b8ba;stroke-linejoin:miter;stroke-width:2.0"
       d="M 50 20 L 60 10.7 L 60 43.2 L 50 53.2 Z" />
  </g>
  <g
     inkscape:groupmode="layer"
     inkscape:label="Vertex"
     id="layer-vertex"
     style="display:inline">
    <circle
       id="vertex"
       inkscape:label="vertex dot"
       style="fill:url(#gradVertex);stroke:#280000;stroke-width:2"
       cx="10.0"
       cy="19.0"
       r="7.5" />
    <circle
       id="vertex-rim"
       inkscape:label="vertex rim"
       style="fill:none;stroke:#ff7f7f;stroke-width:1.5;stroke-opacity:0.9"
       cx="10.0"
       cy="19.0"
       r="5.5" />
  </g>
  <g
     inkscape:groupmode="layer"
     inkscape:label="Pointer"
     id="layer-pointer">
    <!-- tail shortened so it stays clear of the cube's bottom outline -->
    <path
       id="pointer"
       style="fill:url(#gradPointer);stroke:#0b1521;stroke-linejoin:round;stroke-width:1.999999747132984"
       d="M 17.6329 26.9448 L 24.3679 52.0574 L 28.7384 45.1909 L 34.6742 51.8816 L 38.9855 48.6547 L 33.0497 41.9639 L 40.7766 39.8916 Z" />
  </g>
