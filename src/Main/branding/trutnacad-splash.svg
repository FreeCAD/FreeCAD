<!-- TrutnaCAD splash screen and About image (480 x 220, FreeCAD's splash size). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 480 220" width="480" height="220">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22457a"/>
      <stop offset="1" stop-color="#0f2140"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd6c6"/>
      <stop offset="1" stop-color="#139488"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#dde4ee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="220" fill="url(#card)"/>
  <rect x="300" width="180" height="220" fill="url(#grid)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="479" height="219" fill="none" stroke="#c9d3e0"/>

  <!-- Icon, scaled from the 512 x 512 app icon -->
  <g transform="translate(28 44) scale(0.25)">
    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
    <path fill="#0e6f66" d="M 124 206 L 148 230 L 240 230 L 216 206 Z M 296 206 L 320 230 L 412 230 L 388 206 Z M 216 388 L 240 412 L 320 412 L 296 388 Z"/>
    <path fill="url(#side)" d="M 388 132 L 412 156 L 412 230 L 388 206 Z M 296 206 L 320 230 L 320 412 L 296 388 Z"/>
    <path fill="#ffffff" d="M 124 132 H 388 V 206 H 296 V 388 H 216 V 206 H 124 Z"/>
    <line x1="256" y1="96" x2="256" y2="428" stroke="#3fd6c6" stroke-width="6"
          stroke-dasharray="18 12" stroke-linecap="round" opacity="0.85"/>
  </g>

  <text x="168" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1">
    <tspan fill="#14284b">Trutna</tspan><tspan fill="#139488">CAD</tspan>
  </text>
  <text x="170" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" fill="#5b6b82">Parametric 3D modeling</text>
  <text x="170" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="10" fill="#8a97aa">Built on FreeCAD</text>
</svg>
