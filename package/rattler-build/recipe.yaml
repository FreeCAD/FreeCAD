context:
  version: "26.3.0dev"

package:
  name: freecad
  version: "${{ version }}"

source:
  path: ../..
  use_gitignore: true

build:
  number: 0
  script:
    # The build runs inside a pixi/rattler-build sandbox that does not inherit the
    # host environment, so forward the deployment target through explicitly.
    # Without this, build.sh falls back to its default and the macOS 15 package
    # builds the legacy QuickLook generator instead of the modern .appex.
    env:
      MACOS_DEPLOYMENT_TARGET: ${{ env.get("MACOS_DEPLOYMENT_TARGET", default="11.0") }}

requirements:
  build:
    - ccache
    - cmake
    - compilers>=1.10,<1.11
    - doxygen
    - gtest
    - ninja
    - noqt5
    - python>=3.14,<3.15
    - qt6-main
    - swig>=4.3,<4.4

    - if: linux and x86_64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-64
        - libdrm-cos7-x86_64
        - libselinux-cos7-x86_64
        - libsepol-cos7-x86_64
        - libspnav
        - libx11-common-cos7-x86_64
        - libx11-cos7-x86_64
        - libxau-cos7-x86_64
        - libxcb-cos7-x86_64
        - libxdamage-cos7-x86_64
        - libxext-cos7-x86_64
        - libxfixes-cos7-x86_64
        - libxi-cos7-x86_64
        - libxi-devel-cos7-x86_64
        - libxxf86vm-cos7-x86_64
        - mesa-dri-drivers-cos7-x86_64
        - mesa-libegl-cos7-x86_64
        - mesa-libegl-devel-cos7-x86_64
        - mesa-libgl-cos7-x86_64
        - mesa-libgl-devel-cos7-x86_64
        - mold
        - pixman-cos7-x86_64
        - sed
        - sysroot_linux-64
        - xcb-util-cursor  ## FIXME: was ==0.1.5 for #26726; qt6-main >=6.11 needs >=0.1.6
        - xorg-x11-server-common-cos7-x86_64
        - xorg-x11-server-xvfb-cos7-x86_64
        - xorg-xproto

    - if: linux and aarch64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-aarch64
        - libdrm-cos7-aarch64
        - libselinux-cos7-aarch64
        - libsepol-cos7-aarch64
        - libspnav
        - libx11-common-cos7-aarch64
        - libx11-cos7-aarch64
        - libxau-cos7-aarch64
        - libxcb-cos7-aarch64
        - libxdamage-cos7-aarch64
        - libxext-cos7-aarch64
        - libxfixes-cos7-aarch64
        - libxi-cos7-aarch64
        - libxi-devel-cos7-aarch64
        - libxxf86vm-cos7-aarch64
        - mesa-dri-drivers-cos7-aarch64
        - mesa-libegl-cos7-aarch64
        - mesa-libegl-devel-cos7-aarch64
        - mesa-libgl-cos7-aarch64
        - mesa-libgl-devel-cos7-aarch64
        - mold
        - pixman-cos7-aarch64
        - sed
        - sysroot_linux-aarch64
        - xcb-util-cursor  ## FIXME: was ==0.1.5 for #26726; qt6-main >=6.11 needs >=0.1.6
        - xorg-x11-server-common-cos7-aarch64
        - xorg-x11-server-xvfb-cos7-aarch64
        - xorg-xproto

    - if: osx and x86_64
      then:
        - __osx >=10.13

    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}

  host:
    - eigen
    - fmt >=12.1,<12.2
    - freetype
    ## hdf5 <2.2: host and run are solved separately, so host is free to pick a
    ## newer hdf5 than the run closure can use. gmsh (run) needs libmed, whose
    ## newest builds cap at hdf5 <2.2; without this bound host selects hdf5 2.2
    ## and its run_export makes every gmsh candidate unsatisfiable. Drop when
    ## libmed is rebuilt against hdf5 2.2.
    - hdf5<2.2
    - lark
    - libboost-devel
    - matplotlib-base
    - noqt5
    - numpy
    - occt>=8.0,<8.1
    - pcl
    - ply
    - pybind11
    - pyside6
    - python>=3.14,<3.15
    - qt6-main
    - six
    - smesh
    - vtk
    - xerces-c
    - yaml-cpp
    - zlib

    - if: win
      then:
        - winpthreads-devel
        - tbb-devel

    - if: unix
      then:
        - sed

    - if: linux
      then:
        - libspnav
        - xorg-xproto

  run:
    - av
    - blas * openblas*
    - blinker
    - calculix
    - debugpy
    - defusedxml
    - docutils
    - gmsh
    - graphviz
    - ifcopenshell
    - lark
    - lxml
    - matplotlib-base
    - nine
    - noqt5
    - numpy
    - occt>=8.0,<8.1
    - olefile
    - opencamlib
    - pandas
    - pip
    - ply
    - pycollada
    - pyside6
    - python>=3.14,<3.15
    - pyyaml
    - qt6-main
    - requests
    - scipy
    - sympy
    - typing_extensions
    - vtk
    - xlutils

    - if: linux
      then:
        - libspnav
        - qt6-wayland
        - xcb-util-cursor  ## FIXME: was ==0.1.5 for #26726; qt6-main >=6.11 needs >=0.1.6
