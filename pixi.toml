[workspace]
name = "FreeCAD"
version = "26.3.0"
description = "pixi instructions for FreeCAD"
authors = ["looooo <sppedflyer@gmail.com>"]
channels = ["conda-forge"]
platforms = [ "linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64" ]
requires-pixi = ">=0.48"

## macOS needs __osx >=14.0: qt6-main >=6.11.2 pulls moltenvk >=1.4.2, which
## requires it. Without this, macOS solves against pixi's 13.0 default and is
## held on older qt6-main/vtk than Linux and Windows.
## NOTE: pixi deprecates this table in favour of virtual packages on `platforms`,
## but that form requires renaming the platform entries, which would churn the
## lock-file keys. Revisit when pixi allows it without a rename.
[system-requirements]
macos = "14.0"

[dependencies]
av = "*"
blinker = "*"
calculix = "*"
ccache = "*"
cmake = "*"
compilers = ">=1.10,<1.11"
conda-devenv = "*"
debugpy = "*"
defusedxml = "*"
docutils = "*"
doxygen = "*"
eigen = "*"
expat = "*"
fmt = "*"
freetype = "*"
git = "*"
graphviz = "*"
gtest= "*"
harfbuzz = "*"
hdf5 = "*"
ifcopenshell = "*"
lark = "*"
libboost-devel = "*"
lxml = "*"
matplotlib = "*"
nine = "*"
ninja = "*"
noqt5 = "*"
numpy = "*"
nlohmann_json = "*"
occt = ">=8.0,<8.1"
opencamlib = "*"
openssl = "*"
pandas = "*"
pcl = "*"
pip = "*"
ply = "*"
pre-commit = "*"
pyright = "*"
pybind11 = "*"
pycollada = "*"
pyside6 = "*"
python = ">=3.14,<3.15"
pyyaml = "*"
qt6-main = "*"
requests = "*"
scipy = "*"
six = "*"
smesh = "*"
swig = "*"
sympy = "*"
typing-extensions = "*"
tbb-devel = "*"
vtk = "*"
xerces-c = "*"
xlutils = "*"
yaml-cpp = "*"
zlib = "*"
zstd = "*"
compiler-rt = ">=18.1.8,<22"

## Linux Dependencies (x86-64)
[target.linux-64.dependencies]
clang = "*"
clangxx = "*"
cpptrace = { version = "1.0.4.*", build = "libunwind_*" }
kernel-headers_linux-64 = "*"
libdrm-cos7-x86_64 = "*"
libopengl-devel = "*"
libselinux-cos7-x86_64 = "*"
libsepol-cos7-x86_64 = "*"
libspnav = "*"
libx11-common-cos7-x86_64 = "*"
libx11-cos7-x86_64 = "*"
libxau-cos7-x86_64 = "*"
libxcb-cos7-x86_64 = "*"
libxdamage-cos7-x86_64 = "*"
libxext-cos7-x86_64 = "*"
libxfixes-cos7-x86_64 = "*"
libxi-cos7-x86_64 = "*"
libxi-devel-cos7-x86_64 = "*"
libxxf86vm-cos7-x86_64 = "*"
llvm-openmp = "*"
mesa-dri-drivers-cos7-x86_64 = "*"
mesa-libegl-cos7-x86_64 = "*"
mesa-libegl-devel-cos7-x86_64 = "*"
mesa-libgl-cos7-x86_64 = "*"
mesa-libgl-devel-cos7-x86_64 = "*"
mesa-libglu-devel-conda-x86_64 = "*"
mold = "*"
pixman-cos7-x86_64 = "*"
qt6-wayland = "*"
sed = "*"
sysroot_linux-64 = "*"
## FIXME: was pinned ==0.1.5 for https://github.com/FreeCAD/FreeCAD/issues/26726
## (0.1.6 broke cursor rendering on X11). qt6-main >=6.11, required by the occt
## 8.0 stack, hard-requires xcb-util-cursor >=0.1.6, so the pin is no longer
## satisfiable. Re-verify #26726 on X11 before release.
xcb-util-cursor = "*"
xorg-x11-server-common-cos7-x86_64 = "*"
xorg-x11-server-xvfb-cos7-x86_64 = "*"
xorg-xproto = "*"

## Linux Dependencies (aarch64)
[target.linux-aarch64.dependencies]
clang = "*"
clangxx = "*"
cpptrace = { version = "1.0.4.*", build = "libunwind_*" }
kernel-headers_linux-aarch64 = "*"
libdrm-cos7-aarch64 = "*"
libglvnd-cos7-aarch64 = "*"
libglvnd-glx-cos7-aarch64 = "*"
libopengl-devel = "*"
libselinux-cos7-aarch64 = "*"
libsepol-cos7-aarch64 = "*"
libspnav = "*"
libx11-common-cos7-aarch64 = "*"
libx11-cos7-aarch64 = "*"
libxau-cos7-aarch64 = "*"
libxcb-cos7-aarch64 = "*"
libxdamage-cos7-aarch64 = "*"
libxext-cos7-aarch64 = "*"
libxfixes-cos7-aarch64 = "*"
libxi-cos7-aarch64 = "*"
libxi-devel-cos7-aarch64 = "*"
libxxf86vm-cos7-aarch64 = "*"
llvm-openmp = "*"
mesa-dri-drivers-cos7-aarch64 = "*"
mesa-khr-devel-cos7-aarch64 = "*"
mesa-libegl-cos7-aarch64 = "*"
mesa-libegl-devel-cos7-aarch64 = "*"
mesa-libgbm-cos7-aarch64 = "*"
mesa-libgl-cos7-aarch64 = "*"
mesa-libgl-devel-cos7-aarch64 = "*"
mesa-libglapi-cos7-aarch64 = "*"
mold = "*"
pixman-cos7-aarch64 = "*"
qt6-wayland = "*"
sed = "*"
sysroot_linux-aarch64 = "*"
## FIXME: was pinned ==0.1.5 for https://github.com/FreeCAD/FreeCAD/issues/26726
## (0.1.6 broke cursor rendering on X11). qt6-main >=6.11, required by the occt
## 8.0 stack, hard-requires xcb-util-cursor >=0.1.6, so the pin is no longer
## satisfiable. Re-verify #26726 on X11 before release.
xcb-util-cursor = "*"
xorg-x11-server-common-cos7-aarch64 = "*"
xorg-x11-server-xvfb-cos7-aarch64 = "*"
xorg-xproto = "*"

## macOS Dependencies (Intel)
[target.osx-64.dependencies]
cpptrace = "*"
sed = "*"

## macOS Dependencies (Apple Silicon)
[target.osx-arm64.dependencies]
cpptrace = "*"
sed = "*"

[target.win-64.dependencies]
cpptrace = "*"
## pthreads-win32 dropped: libwinpthread >=12, pulled in by the smesh build
## against occt 8.0, declares "constrains: pthreads-win32 <0.0a0".

[pypi-dependencies]
freecad-stubs = "*"

## Qt 6 Configuration Presets
[target.linux-64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-linux-debug", "{{ extra_args }}" ], args = [{ "arg" ="extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-linux-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.linux-aarch64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-linux-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on= ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-linux-release" ], depends-on= ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.osx-64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-macos-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-macos-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.osx-arm64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-macos-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-macos-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.win-64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-windows-debug", "-DCMAKE_GENERATOR_PLATFORM=", "-DCMAKE_GENERATOR_TOOLSET=", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-windows-release", "-DCMAKE_GENERATOR_PLATFORM=", "-DCMAKE_GENERATOR_TOOLSET=" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
freecad-debug = { cmd = [ ".pixi/envs/default/Library/bin/FreeCAD.exe" ], depends-on = ["install-debug"]}
freecad-release = { cmd = [ ".pixi/envs/default/Library/bin/FreeCAD.exe" ], depends-on = ["install-release"]}

[tasks]
initialize = { cmd = ["git", "submodule", "update", "--init", "--recursive"]}
# redirect to debug by default
configure = [{ task = "configure-debug" }]
build = [{ task = "build-debug" }]
install = [{ task = "install-debug" }]
test = [{ task = "test-debug" }]
freecad = [{ task = "freecad-debug" }]

build-debug = { cmd = ["cmake", "--build", "build/debug"]}
build-release = { cmd = ["cmake", "--build", "build/release"]}
install-debug = { cmd = ["cmake", "--install", "build/debug"]}
install-release = { cmd = ["cmake", "--install", "build/release"]}
test-debug = { cmd = ["ctest", "--test-dir", "build/debug"]}
test-release = { cmd = ["ctest", "--test-dir", "build/release"]}
freecad-debug = "build/debug/bin/FreeCAD"
freecad-release = "build/release/bin/FreeCAD"
