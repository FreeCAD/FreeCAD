[workspace]
name = "FreeCAD"
version = "26.3.0"
description = "pixi instructions for FreeCAD"
authors = ["looooo <sppedflyer@gmail.com>"]
channels = ["conda-forge"]
platforms = [
    { platform = "linux-64" },
    { platform = "linux-aarch64" },
    { platform = "osx-64", macos = "14.0" },
    { platform = "osx-arm64", macos = "14.0" },
    { platform = "win-64" },
]
requires-pixi = ">=0.81.0"

