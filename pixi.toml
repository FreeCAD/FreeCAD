## FIXME: was pinned ==0.1.5 for https://github.com/FreeCAD/FreeCAD/issues/26726
## (0.1.6 broke cursor rendering on X11). qt6-main >=6.11, required by the occt
## 8.0 stack, hard-requires xcb-util-cursor >=0.1.6, so the pin is no longer
## satisfiable. Re-verify #26726 on X11 before release.
